name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release manifest
        run: python3 scripts/check_manifest.py
      - name: Release packaging tests
        run: python3 tests/release_packaging_test.py
      - name: Build source archives from the manifest (not published)
        run: |
          python3 scripts/build_release.py --output-dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release" && sha256sum -c SHA256SUMS
      - name: ShellCheck
        run: shellcheck -x bin/aicm bin/*.sh lib/*.sh tests/*.sh

  unix:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lock inspection tool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Use the bash 3.2 that ships with macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/oldbash"
          ln -s /bin/bash "$RUNNER_TEMP/oldbash/bash"
          echo "$RUNNER_TEMP/oldbash" >> "$GITHUB_PATH"
      - run: bash --version | head -n 1
      - name: Cleanup tests
        run: bash tests/clean_test.sh
      - name: Live SQLite and symlink ancestor regressions
        run: python3 tests/cleanup_safety_test.py
      - name: Cache budget rules and byte sums above 2 GiB
        run: bash tests/cache_budget_test.sh
      - name: Cache budget engine (PowerShell 7 on ${{ runner.os }}, portable checks)
        shell: pwsh
        run: ./tests/cache_budget_test.ps1
      - name: Command and schedule tests
        run: bash tests/aicm_test.sh
      - name: Inventory and catalog update tests
        run: bash tests/inventory_test.sh
      - name: npm recovery ownership regressions
        run: python3 tests/npm_recovery_safety_test.py
      - name: Codex app-server recycle tests
        run: bash tests/codex_host_test.sh
      - name: Archive, history and cleanup-scope tests
        run: bash tests/maintenance_integration_test.sh
      - name: Update verify
        run: bash tests/update_verify_test.sh
      - name: Per-CLI update policy tests
        run: bash tests/update_policy_test.sh
      - name: Worktree, config drift, process, optimize and boundary tests (Node)
        run: node --test tests/node/*.test.js

  windows:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        suite: [clean_test, aicm_test, inventory_test, maintenance_json_test, update_policy_test, home_ownership_test, unicode_paths_test, cache_budget_test, windowless_launcher_test]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native ${{ matrix.suite }} (${{ matrix.shell }})
        run: .\tests\${{ matrix.suite }}.ps1

  windows-node:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worktree, config drift, process, optimize and boundary tests (Node)
        shell: pwsh
        run: |
          $nodeTests = @(Get-ChildItem -Path tests/node -Filter *.test.js | ForEach-Object { $_.FullName })
          node --test --test-concurrency=2 @nodeTests
      - name: PSScriptAnalyzer errors
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $found | Format-Table -AutoSize | Out-String | Write-Host
          if ($found) { exit 1 }
