# id | path | max-age-days | excludes (comma-separated globs, basename or relative path)
# Only manager-owned scratch/cache. Never general OS temp, histories, credentials or package caches.
# Override/add rows in ~/.ai-cli-auto-manager/maintenance.local.conf.
manager-temp | {aicm}/tmp | 2 | *.lock,keep/**
manager-cache | {aicm}/cache | 2 | *.lock,keep/**
