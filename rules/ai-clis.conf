# AI CLI Auto Manager - catalog of AI coding CLIs (shared by Windows and macOS/Linux)
#
# The weekly inventory looks for every row here; the daily update keeps the installed ones current.
# Add your own rows in ~/.ai-cli-auto-manager/ai-clis.local.conf (same id replaces a row here).
#
# Columns are separated by "|". Use "-" or leave empty when a column does not apply.
#   id           target name used by --targets / -Targets
#   command      executable name on PATH ("-" for desktop apps found only through winget)
#   name         display name
#   npm          global npm package
#   brew         Homebrew formula or cask (macOS)
#   winget       winget package id (Windows)
#   self_update  arguments for the CLI's own updater, run when it is installed standalone ("@installer" = vendor install script)
#
# The first six ids have dedicated update logic in bin/update_ai_clis.*; the rest are updated
# generically through whichever package manager installed the copy that is on PATH.
#
# id               | command      | name                | npm                        | brew        | winget              | self_update | note
claude             | claude       | Claude Code         | @anthropic-ai/claude-code  | claude-code |                     | update      |
codex              | codex        | OpenAI Codex        | @openai/codex              | codex       |                     |             | the Codex desktop app ships its own copy and updates it itself
opencode           | opencode     | OpenCode            | @opencode/cli              | opencode    |                     | upgrade     |
grok               | grok         | Grok Build          | @xai-official/grok         |             |                     | @installer  |
kimi               | kimi         | Kimi Code           | @moonshot-ai/kimi-code     |             |                     |             |
agy                | agy          | Antigravity CLI     |                            |             |                     | update      |
gemini             | gemini       | Gemini CLI          | @google/gemini-cli         | gemini-cli  |                     |             |
qwen               | qwen         | Qwen Code           | @qwen-code/qwen-code       |             |                     |             |
copilot            | copilot      | GitHub Copilot CLI  | @github/copilot            |             |                     |             |
amp                | amp          | Amp                 | @sourcegraph/amp           |             |                     |             |
auggie             | auggie       | Augment Auggie      | @augmentcode/auggie        |             |                     |             |
crush              | crush        | Crush               | @charmland/crush           |             |                     |             |
continue           | cn           | Continue CLI        | @continuedev/cli           |             |                     |             |
cursor-agent       | cursor-agent | Cursor Agent        |                            |             |                     | update      |
goose              | goose        | Goose               |                            |             |                     | update      |
droid              | droid        | Factory Droid       |                            |             |                     |             |
aider              | aider        | Aider               |                            |             |                     |             | installed with pip/pipx/uv; update it with the same tool
opencode-desktop   | -            | OpenCode Desktop    |                            |             | SST.OpenCodeDesktop |             | desktop app
