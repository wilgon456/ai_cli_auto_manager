# AI CLI Auto Manager - cleanup categories (shared by Windows and macOS/Linux)
#
# Columns are separated by "|". Surrounding spaces are ignored.
#   id         rule id from clean-rules.conf
#   category   sessions | cache | logs | temp | other
#
# A rule id that is not listed (a local or custom rule) is category "other".
# gemini-tmp and qwen-tmp hold chats and checkpoints, so they are sessions.
#
# id                   | category
codex-sessions         | sessions
claude-transcripts     | sessions
gemini-tmp             | sessions
qwen-tmp               | sessions
grok-sessions          | sessions
copilot-sessions       | sessions
npm-cache              | cache
pip-cache              | cache
uv-cache               | cache
playwright-browsers    | cache
codex-trace-db         | logs
codex-trace-db-legacy  | logs
claude-debug           | logs
kimi-logs              | logs
codex-tmp              | temp
codex-tmp-legacy       | temp
claude-temp            | temp
os-temp                | temp
codex-images           | other
claude-file-history    | other
grok-downloads         | other
