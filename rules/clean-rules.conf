# AI CLI Auto Manager - cleanup rules (shared by Windows and macOS/Linux)
#
# Columns are separated by "|". Surrounding spaces are ignored.
#   id       rule name; a row in ~/.ai-cli-auto-manager/clean-rules.local.conf with the same id replaces it
#   os       all | windows | unix | mac | linux
#   kind     archive      session files older than <days> move to ~/.ai-cli-auto-manager/archive/<id>/<date>/;
#                         archive folders older than <limit> days are deleted (remnants)
#            codex        Codex sessions through Codex's own commands: `codex archive` after <days>,
#                         `codex delete --force` after <days> + <limit> (files are never removed directly,
#                         because Codex also keeps every session in its database)
#            age          delete files older than <days> that match <pattern>, then prune empty folders
#            cap          delete files matching <pattern> directly in <path> when older than <days> or larger than <limit> MB
#            keep-latest  for versioned child folders (name-1234), keep the newest <limit> per name and remove the rest
#            command      run "<path> <pattern>" when the <path> command exists (tool-native cleanup)
#   path     ~ = home, {temp} = user temp folder, {localappdata} = %LOCALAPPDATA% (Windows),
#            {cache} = %LOCALAPPDATA% / ~/Library/Caches / $XDG_CACHE_HOME
#   default  on | off
#
# Conversation history is archived first and deleted later; temp files, logs and caches are deleted directly.
# When a CLI deletes its own history (Claude Code cleanupPeriodDays, Gemini CLI sessionRetention, Qwen Code
# cleanupPeriodDays), the archive step runs a week before that, so nothing is lost to the CLI's own cleanup.
#
# Paths must stay inside the home folder or the temp folder. Links (symlinks, junctions) are never followed.
# Never deleted, whatever the rule says: MEMORY.md, CLAUDE.md, AGENTS.md, GEMINI.md, auth/credential files,
# settings/config files, *.env, and anything inside a folder named "memory".
#
# id                   | os      | kind        | path                                  | pattern       | days | limit | default | note
codex-sessions         | all     | codex       | ~/.codex                              | rollout-*     | 30   | 60    | on      | Codex sessions: archived after 30 days unused, deleted 60 days later
codex-tmp              | all     | age         | ~/.codex/.tmp                         | *             | 7    |       | on      | Codex scratch files
codex-tmp-legacy       | all     | age         | ~/.codex/tmp                          | *             | 7    |       | on      | Codex scratch files (older layout)
codex-trace-db         | all     | cap         | ~/.codex                              | logs_*.sqlite | 30   | 200   | on      | Codex trace log DB, grows without limit
codex-trace-db-legacy  | all     | cap         | ~/.codex/sqlite                       | logs_*.sqlite | 30   | 200   | on      | Codex trace log DB (older layout)
codex-images           | all     | archive     | ~/.codex/generated_images             | *             | 30   | 60    | off     | Images Codex generated (user output)
claude-transcripts     | all     | archive     | ~/.claude/projects                    | *.jsonl       | 30   | 60    | on      | Claude Code transcripts (memory .md files untouched)
claude-file-history    | all     | age         | ~/.claude/file-history                | *             | 30   |       | on      | Claude Code rewind backups
claude-debug           | all     | age         | ~/.claude/debug                       | *             | 14   |       | on      | Claude Code debug logs
claude-temp            | windows | age         | {temp}/claude                         | *             | 3    |       | on      | Claude Code per-session temp files
gemini-tmp             | all     | archive     | ~/.gemini/tmp                         | *             | 30   | 60    | on      | Gemini CLI chats and checkpoints
qwen-tmp               | all     | archive     | ~/.qwen/tmp                           | *             | 30   | 60    | on      | Qwen Code chats and checkpoints
grok-sessions          | all     | archive     | ~/.grok/sessions                      | *             | 30   | 60    | on      | Grok Build sessions
copilot-sessions       | all     | archive     | ~/.copilot/session-state              | *             | 30   | 60    | on      | GitHub Copilot CLI sessions
grok-downloads         | all     | age         | ~/.grok/downloads                     | *             | 14   |       | on      | Grok Build installer downloads
kimi-logs              | all     | age         | ~/.kimi/kimi-claw/log                 | *             | 30   |       | on      | Kimi logs
npm-cache              | windows | age         | {localappdata}/npm-cache/_cacache     | *             | 60   |       | on      | npm download cache (content-addressed, refetched on demand)
npm-cache              | unix    | age         | ~/.npm/_cacache                       | *             | 60   |       | on      | npm download cache (content-addressed, refetched on demand)
pip-cache              | windows | age         | {localappdata}/pip/cache              | *             | 30   |       | on      | pip download cache
pip-cache              | mac     | age         | ~/Library/Caches/pip                  | *             | 30   |       | on      | pip download cache
pip-cache              | linux   | age         | {cache}/pip                           | *             | 30   |       | on      | pip download cache
uv-cache               | all     | command     | uv                                    | cache prune   |      |       | on      | uv removes its own unused cache entries
os-temp                | windows | age         | {temp}                                | *             | 7    |       | on      | Windows user temp folder (files in use are skipped)
playwright-browsers    | windows | keep-latest | {localappdata}/ms-playwright          | *             |      | 2     | off     | Old Playwright browser builds; projects pinned to them must reinstall
playwright-browsers    | mac     | keep-latest | ~/Library/Caches/ms-playwright        | *             |      | 2     | off     | Old Playwright browser builds; projects pinned to them must reinstall
playwright-browsers    | linux   | keep-latest | {cache}/ms-playwright                 | *             |      | 2     | off     | Old Playwright browser builds; projects pinned to them must reinstall
